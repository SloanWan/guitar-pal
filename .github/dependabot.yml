version: 2

# Security updates are switched on in the repository settings, not here; this
# file is the scheduled version bumps. Minor and patch updates are grouped into
# one pull request per ecosystem so a quiet week is one review, not twenty.
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              update-types: [minor, patch]

    # book-service declares its dependencies in pyproject.toml under [project],
    # which Dependabot reads as PEP 621.
    - package-ecosystem: pip
      directory: /book-service
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          actions:
              patterns: ["*"]
