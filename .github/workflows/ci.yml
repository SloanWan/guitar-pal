name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Type Check, Lint & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    book-service:
        name: Book service (ruff & pytest)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: book-service

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: book-service/pyproject.toml

            - name: Install
              run: pip install -e ".[dev]"

            - name: Lint
              run: ruff check . && ruff format --check .

            - name: Test
              run: pytest -q

    e2e:
        name: End-to-end (Playwright)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            # Builds the app, serves it on 3100 and walks one short path per
            # page. The account and share specs skip themselves when their
            # secrets are missing, so a fork's PR still runs the rest.
            - name: Test
              run: npm run test:e2e
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
                  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
                  E2E_SHARE_ID: ${{ secrets.E2E_SHARE_ID }}

            - name: Upload the report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
