name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Type Check, Lint & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    book-service:
        name: Book service (ruff & pytest)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: book-service

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: book-service/pyproject.toml

            - name: Install
              run: pip install -e ".[dev]"

            - name: Lint
              run: ruff check . && ruff format --check .

            - name: Test
              run: pytest -q

    api-service:
        name: API service (Maven verify)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api-service

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
                  cache-dependency-path: api-service/pom.xml

            # Compiles and runs every test; the database tests start Postgres
            # through Testcontainers on the runner's own Docker.
            - name: Test
              run: ./mvnw -B verify

    e2e:
        name: End-to-end (${{ matrix.engine }})
        runs-on: ubuntu-latest
        # One job an engine (#457), so a WebKit failure never hides behind, or
        # holds up, a Chromium result. The CI WebKit is the Linux build of
        # Safari's engine, not Safari itself.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - engine: Chromium
                      browser: chromium
                      projects: --project=smoke --project=account
                    - engine: WebKit
                      browser: webkit
                      projects: --project=smoke-webkit --project=smoke-iphone

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # The browser download is the slow part; it changes only with the
            # Playwright version the lock file pins.
            - name: Cache the browser
              id: browser-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

            - name: Install the browser
              if: steps.browser-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps ${{ matrix.browser }}

            # A cached browser still needs its system libraries on a fresh runner.
            - name: Install the browser's system libraries
              if: steps.browser-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps ${{ matrix.browser }}

            # Builds the app, serves it on 3100 and walks one short path per
            # page. The account and share specs skip themselves when their
            # secrets are missing, so a fork's PR still runs the rest.
            - name: Test
              run: npm run test:e2e -- ${{ matrix.projects }}
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
                  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
                  E2E_SHARE_ID: ${{ secrets.E2E_SHARE_ID }}

            - name: Upload the report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ matrix.browser }}
                  path: playwright-report/
                  retention-days: 7
