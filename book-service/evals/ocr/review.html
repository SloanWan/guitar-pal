<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>OCR reference review</title>
<style>
:root { --bg:#f6f8fb; --panel:#fff; --ink:#1c2733; --dim:#5a6b7d; --line:#d5dde7;
  --accent:#4a6fa5; --tint:#e6edf6; --del:#f6d5d2; --ins:#d8e8d0; }
@media (prefers-color-scheme: dark) { :root { --bg:#11161d; --panel:#18202a; --ink:#e3e9f0;
  --dim:#94a3b4; --line:#2c3846; --accent:#8fb0dc; --tint:#1f2c3d; --del:#4a2421; --ins:#22381f; } }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 system-ui, "PingFang SC", sans-serif; display:grid;
  grid-template-columns:250px 1fr; height:100vh; }
nav { border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
nav h1 { font-size:14px; margin:12px; } nav button { display:flex; justify-content:space-between;
  width:100%; border:0; border-top:1px solid var(--line); background:none; color:inherit;
  padding:7px 12px; text-align:left; cursor:pointer; font:12px ui-monospace, monospace; }
nav button[aria-current=true] { background:var(--tint); } nav .ok { color:var(--accent); }
main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; padding:14px;
  overflow:hidden; } .col { overflow:auto; display:flex; flex-direction:column; gap:12px; }
img { width:100%; border:1px solid var(--line); background:#fff; }
textarea { width:100%; min-height:340px; font:13px/1.7 ui-monospace, "PingFang SC", monospace;
  background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:10px; }
.bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.bar button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 14px; cursor:pointer; }
.note { color:var(--dim); font-size:12px; } .reading { background:var(--panel); border:1px solid var(--line);
  border-radius:6px; padding:10px; } .reading h3 { margin:0 0 6px; font-size:12px; color:var(--dim); }
.diff { white-space:pre-wrap; font:13px/1.7 ui-monospace, "PingFang SC", monospace; }
.diff del { background:var(--del); text-decoration:line-through; } .diff ins { background:var(--ins); text-decoration:none; }
details summary { cursor:pointer; color:var(--dim); font-size:12px; }
</style></head><body>
<nav><h1>OCR references</h1><div id="list"></div></nav>
<main><div class="col"><a id="imglink" target="_blank" title="Open full size"><img id="img" alt="scanned page"></a></div>
<div class="col">
 <div class="bar"><strong id="title"></strong><span class="note" id="note"></span></div>
 <textarea id="ref" spellcheck="false" aria-label="Reference text"></textarea>
 <div class="bar"><label><input type="checkbox" id="checked"> Checked against the page</label>
  <button id="save">Save</button><span class="note" id="status"></span></div>
 <p class="note">Below, each reading against the reference: <del>struck red</del> is in the
  reference but not the reading; <ins>green</ins> is in the reading but not the reference.
  Notation is marked <code>[notation]</code> in the reference and not transcribed.</p>
 <div id="readings"></div>
</div></main>
<script>
let current = null, list = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function renderDiff(segs) {
  return segs.map(([op, t]) => op === "=" ? esc(t) : op === "-" ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`).join("");
}
async function loadList() {
  list = (await (await fetch("/api/pages")).json()).pages;
  $("list").innerHTML = list.map((p, i) =>
    `<button data-i="${i}" aria-current="${current && p.stem === current.stem && p.page_id === current.page_id}">
      <span>${esc(p.stem.replace(/^sample-/, ""))}/${p.page_id}</span>
      <span>${p.checked ? '<span class="ok">✓</span> ' : ""}${(p.disputed * 100).toFixed(1)}%</span></button>`).join("");
  $("list").querySelectorAll("button").forEach((b) => b.onclick = () => open(list[+b.dataset.i]));
}
function show(detail, meta) {
  current = detail;
  $("title").textContent = `${detail.stem} / ${detail.page_id}`;
  $("note").textContent = meta.note ? `reference from ${meta.note}` : `transcriptions disagree on ${(meta.disputed * 100).toFixed(1)}% of characters`;
  $("img").src = $("imglink").href = `/img/${encodeURIComponent(detail.stem)}/${detail.page_id}`;
  $("ref").value = detail.reference;
  $("checked").checked = meta.checked;
  $("status").textContent = "";
  $("readings").innerHTML = detail.readings.map((r, i) =>
    `<details class="reading" ${i === 1 ? "open" : ""}><summary>${esc(r.label)}</summary><div class="diff">${renderDiff(r.diff)}</div></details>`).join("");
}
async function open(meta) {
  const d = await (await fetch(`/api/page/${encodeURIComponent(meta.stem)}/${meta.page_id}`)).json();
  show(d, meta); loadList();
}
$("save").onclick = async () => {
  const meta = list.find((p) => p.stem === current.stem && p.page_id === current.page_id);
  const res = await fetch("/api/save", { method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ stem: current.stem, page_id: current.page_id, text: $("ref").value, checked: $("checked").checked }) });
  if (!res.ok) { $("status").textContent = "Not saved: " + (await res.json()).error; return; }
  meta.checked = $("checked").checked;
  show(await res.json(), meta); $("status").textContent = "Saved."; loadList();
};
loadList().then(() => list.length && open(list[0]));
</script></body></html>
