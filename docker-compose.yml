services:
  web:
    build:
      context: .
      # Compose interpolates ${...} from the .env file next to this compose file,
      # so one server-side .env feeds both the build args and the runtime env.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    # Textbook import (#200) is not open for use: without BOOK_SERVICE_URL the
    # /books pages say so and show the sample, and nothing else changes. To
    # open it, put BOOK_SERVICE_URL=http://book-service:8000 in .env and bring
    # the service up with `docker compose --profile books up --build -d`.
    env_file: .env
    # Loopback only: Nginx on the host is the public entry point.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  book-service:
    # Opt-in (see `web`): a plain `docker compose up` neither builds nor
    # starts it, and `--remove-orphans` leaves a stopped one alone only while
    # the profile is named.
    profiles: ["books"]
    build:
      context: ./book-service
    # The same .env: it reads NEXT_PUBLIC_SUPABASE_URL for the JWT issuer and
    # JWKS, NEXT_PUBLIC_SUPABASE_ANON_KEY for Storage, ANTHROPIC_API_KEY,
    # BOOK_SERVICE_INTERNAL_SECRET (shared with `web`), plus SUPABASE_JWT_SECRET
    # (legacy projects only) and BOOK_SERVICE_DATABASE_URL. No ports — only
    # `web` talks to it, and it talks back to `web` only to validate drafts.
    env_file: .env
    environment:
      BOOK_SERVICE_VALIDATE_URL: http://web:3000
      # Chapter Q&A (#203): how the chapter reaches the model. `long_context`
      # until the eval (book-service/evals/ask/) has run; its decision rule
      # says whether `rag` replaces it.
      BOOK_ASK_STRATEGY: long_context
      # Which model answers: `anthropic`, or `deepseek` for DeepSeek-V4.1-Flash
      # (DEEPSEEK_API_KEY in .env). See book-service/docs/calibration.md §8 for
      # what each can read.
      BOOK_ASK_PROVIDER: anthropic
    restart: unless-stopped
